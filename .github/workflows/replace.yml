name: Replace index.html with new book file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new book file
        run: |
          git config user.name "lilypessane2-code"
          git config user.email "lilypessane2-code@users.noreply.github.com"
          git rm index.html
          git mv livro-de-receitas-en-vegetarian.html index.html
          git commit -m "Menu drop-down banner on recipe pages (back button + contents drop-down)"
          git push
