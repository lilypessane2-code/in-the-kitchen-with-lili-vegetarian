name: Rename book file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "lilypessane2-code"
          git config user.email "lilypessane2-code@users.noreply.github.com"
          git mv livro-de-receitas-en-vegetarian.html index.html
          git commit -m "Rename book file to index.html"
          git push
